# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Locks the TT-17018 fix for bootstrap pre/post-install Jobs: pod-template and
# Job metadata must never render literal `null` for labels/annotations.
#
# Regression guarded (pre-fix these keys rendered as bare `key:` -> YAML null):
#   * spec.template.metadata.labels        -> null   (now: real pod labels)
#   * spec.template.metadata.annotations   -> null   (now: key omitted when empty)
#   * metadata.annotations (Job, when disableHelmHooks=true + no job annotations)
#                                          -> null   (now: key omitted)
suite: Bootstrap pre/post-install Job metadata renders no null keys
templates:
  - templates/bootstrap-pre-install.yaml
  - templates/bootstrap-post-install.yaml
release:
  name: tyk-bootstrap
  namespace: test
tests:
  # ---------- pre-install ----------
  - it: pre-install, disableHelmHooks=true, empty pod meta -> no null keys, real pod labels
    template: templates/bootstrap-pre-install.yaml
    set:
      global.components.bootstrap: true
      bootstrap.disableHelmHooks: true
    asserts:
      - hasDocuments:
          count: 1
      # Job-level annotations key must be omitted (hooks stripped, no job annotations)
      - notExists:
          path: metadata.annotations
      # Pod-template annotations key must be omitted when podAnnotations empty
      - notExists:
          path: spec.template.metadata.annotations
      # Pod-template labels must be present and carry the bootstrap marker + standard labels
      - exists:
          path: spec.template.metadata.labels
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-pre-install
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: tyk-bootstrap

  - it: pre-install, default (hooks enabled) -> hook annotations intact, no pod-template nulls
    template: templates/bootstrap-pre-install.yaml
    set:
      global.components.bootstrap: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-pre-install
      - notExists:
          path: spec.template.metadata.annotations

  - it: pre-install, populated pod meta + job annotations -> values flow through
    template: templates/bootstrap-pre-install.yaml
    set:
      global.components.bootstrap: true
      bootstrap.disableHelmHooks: true
      bootstrap.podLabels.preInstallPodLabels.team: payments
      bootstrap.podAnnotations.preInstallPodAnnotations.sampleAnnotation: enabled
      bootstrap.jobs.preInstall.annotations.sampleJobAnnotation: wave1
    asserts:
      - equal:
          path: spec.template.metadata.labels["team"]
          value: payments
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-pre-install
      - equal:
          path: spec.template.metadata.annotations.sampleAnnotation
          value: enabled
      - equal:
          path: metadata.annotations.sampleJobAnnotation
          value: wave1

  # ---------- post-install ----------
  - it: post-install, disableHelmHooks=true, empty pod meta -> no null keys, real pod labels
    template: templates/bootstrap-post-install.yaml
    set:
      global.components.bootstrap: true
      bootstrap.disableHelmHooks: true
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations
      - notExists:
          path: spec.template.metadata.annotations
      - exists:
          path: spec.template.metadata.labels
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-post-install
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: tyk-bootstrap

  - it: post-install, default (hooks enabled) -> hook annotations intact, no pod-template nulls
    template: templates/bootstrap-post-install.yaml
    set:
      global.components.bootstrap: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-post-install
      - notExists:
          path: spec.template.metadata.annotations

  - it: post-install, populated pod meta + job annotations -> values flow through
    template: templates/bootstrap-post-install.yaml
    set:
      global.components.bootstrap: true
      bootstrap.disableHelmHooks: true
      bootstrap.podLabels.postInstallPodLabels.team: payments
      bootstrap.podAnnotations.postInstallPodAnnotations.sampleAnnotation: enabled
      bootstrap.jobs.postInstall.annotations.sampleJobAnnotation: wave1
    asserts:
      - equal:
          path: spec.template.metadata.labels["team"]
          value: payments
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-post-install
      - equal:
          path: spec.template.metadata.annotations.sampleAnnotation
          value: enabled
      - equal:
          path: metadata.annotations.sampleJobAnnotation
          value: wave1
