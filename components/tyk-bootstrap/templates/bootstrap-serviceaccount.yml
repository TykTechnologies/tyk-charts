{{- if .Values.bootstrap -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "k8s-bootstrap-role" .Values.bootstrap.serviceAccountName | quote }}
  {{- if or (not .Values.bootstrap.disableHelmHooks) .Values.bootstrap.rbacAnnotations }}
  annotations:
    {{- if not .Values.bootstrap.disableHelmHooks }}
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-10"
    {{- end }}
    {{- range $key, $value := .Values.bootstrap.rbacAnnotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
{{- with .Values.bootstrap.imagePullSecrets }}
imagePullSecrets: {{ toYaml . | nindent 2 }}
{{- end }}
{{- end }}
