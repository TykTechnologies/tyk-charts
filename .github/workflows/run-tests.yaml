name: Run Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - master

permissions: {}

env:
  TIMEOUT: 30m
  TYK_OSS_NS: tyk-oss
  TYK_DATAPLANE_NS: tyk-dataplane
  TYK_STACK_NS: tyk-stack

jobs:
  dep-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for dependency changes
        id: check
        run: echo "skip=false" >> "$GITHUB_OUTPUT"

  lint-test:
    needs: [dep-guard]
    if: always() && (needs.dep-guard.result == 'success' || needs.dep-guard.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@b0d4458c71155b54fcf33e11dd465dc923550009  # v2.0.1
        with:
          version: v3.3.0

      - name: Add dependencies
        run: helm repo add tyk-helm https://helm.tyk.io/public/helm/charts/

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml --all

  smoke-tests:
    needs: [dep-guard]
    if: always() && (needs.dep-guard.result == 'success' || needs.dep-guard.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s_version: ["v1.26.13", "v1.27.10","v1.28.6","v1.29.4","v1.30.0"]
    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Create Kind Cluster
        uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced  # v1.9.0
        with:
          # TODO: Pin kindest/node image to digest
          node_image: "kindest/node:${{ matrix.k8s_version }}"

      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Deploy Tyk OSS and Dependencies
        id: smoke-deploy-oss
        run: |
          kubectl create namespace ${{ env.TYK_OSS_NS }}

          # Do not change the name
          # TODO: Pin OCI helm chart to digest
          helm install redis oci://registry-1.docker.io/bitnamicharts/redis --wait -n ${{ env.TYK_OSS_NS }} --timeout ${{ env.TIMEOUT }} \
            --set image.repository=bitnamilegacy/redis \
            --set sentinel.image.repository=bitnamilegacy/redis-sentinel \
            --set metrics.image.repository=bitnamilegacy/redis-exporter \
            --set volumePermissions.image.repository=bitnamilegacy/os-shell \
            --set kubectl.image.repository=bitnamilegacy/kubectl \
            --set sysctl.image.repository=bitnamilegacy/os-shell

          helm dependency update ./tyk-oss
          helm install tyk-oss ./tyk-oss -n ${{ env.TYK_OSS_NS }} --wait --timeout ${{ env.TIMEOUT }} \
            --set global.redis.addrs={redis-master.${{ env.TYK_OSS_NS }}.svc:6379} \
            --set global.redis.passSecret.name=redis \
            --set global.redis.passSecret.keyName=redis-password

      - name: Upgrade Tyk OSS
        id: smoke-upgrade-oss
        run: |
          helm upgrade -n ${{ env.TYK_OSS_NS }} tyk-oss ./tyk-oss --wait --timeout ${{ env.TIMEOUT }} --reuse-values --set tyk-gateway.gateway.kind=DaemonSet

      - name: Uninstall Tyk OSS
        run: |
          helm uninstall tyk-oss -n ${{ env.TYK_OSS_NS }} --timeout ${{ env.TIMEOUT }}
          kubectl delete namespace ${{ env.TYK_OSS_NS }}

      - name: Deploy Tyk Data Plane
        id: smoke-deploy-data-plane
        run: |
          kubectl create namespace ${{ env. TYK_DATAPLANE_NS }}

          # Do not change the name
          # TODO: Pin OCI helm chart to digest
          helm install redis oci://registry-1.docker.io/bitnamicharts/redis --wait -n ${{ env. TYK_DATAPLANE_NS }} --timeout ${{ env.TIMEOUT }} \
            --set image.repository=bitnamilegacy/redis \
            --set sentinel.image.repository=bitnamilegacy/redis-sentinel \
            --set metrics.image.repository=bitnamilegacy/redis-exporter \
            --set volumePermissions.image.repository=bitnamilegacy/os-shell \
            --set kubectl.image.repository=bitnamilegacy/kubectl \
            --set sysctl.image.repository=bitnamilegacy/os-shell

          helm dependency update ./tyk-data-plane

          helm install --namespace ${{ env. TYK_DATAPLANE_NS }} tyk-data-plane ./tyk-data-plane --wait --timeout ${{ env.TIMEOUT }} \
            --set global.remoteControlPlane.orgId=${{ secrets.HYBRID_RPC_KEY }} \
            --set global.remoteControlPlane.userApiKey=${{ secrets.HYBRID_API_KEY }} \
            --set global.remoteControlPlane.connectionString=${{ secrets.HYBRID_MDCB_HOST }} \
            --set global.redis.addrs={redis-master.${{ env.TYK_DATAPLANE_NS }}.svc:6379} \
            --set global.redis.passSecret.name=redis \
            --set global.redis.passSecret.keyName=redis-password

      - name: Upgrade Tyk Data Plane
        id: smoke-upgrade-data-plane
        run: |
          helm upgrade -n ${{ env. TYK_DATAPLANE_NS }} tyk-data-plane ./tyk-data-plane --wait --timeout ${{ env.TIMEOUT }} --reuse-values --set tyk-gateway.gateway.kind=DaemonSet

      # Always-on diagnostics when any step in this smoke-tests job has failed.
      # Replaces the prior failure handler which referenced step IDs that didn't exist,
      # so it produced no output when --wait timed out.
      - if: failure()
        name: Diagnostics on failure
        run: |
          for NS in ${{ env.TYK_OSS_NS }} ${{ env. TYK_DATAPLANE_NS }}; do
            if kubectl get namespace "$NS" >/dev/null 2>&1; then
              echo "=================================================================="
              echo "NAMESPACE: $NS"
              echo "=================================================================="
              echo "--- pods ---"
              kubectl get pods -n "$NS" -o wide || true
              echo "--- events (last 50) ---"
              kubectl get events -n "$NS" --sort-by='.lastTimestamp' | tail -50 || true
              echo "--- describe all pods ---"
              kubectl get pods -n "$NS" -o name | while read p; do kubectl describe -n "$NS" "$p" || true; done
              echo "--- tyk-gateway logs (current) ---"
              kubectl logs -n "$NS" -l app.kubernetes.io/name=tyk-gateway --all-containers --tail=200 --prefix || true
              echo "--- tyk-gateway logs (previous, if any container crashed) ---"
              kubectl logs -n "$NS" -l app.kubernetes.io/name=tyk-gateway --all-containers --tail=200 --prefix --previous || true
            fi
          done

      - name: Uninstall Tyk Data Plane
        run: |
          helm uninstall tyk-data-plane -n ${{ env. TYK_DATAPLANE_NS }} --timeout ${{ env.TIMEOUT }}
          kubectl delete namespace ${{ env. TYK_DATAPLANE_NS }}

  # ---------------------------------------------------------------------------------------------
  # This job exists to get as close to OpenShift as we can on a kind cluster. It does not get
  # close. Read this before assuming OpenShift is covered by CI — it is not.
  #
  # WHAT WE ARE TRYING TO APPROXIMATE
  #   On OpenShift, the SCC admission controller *mutates* an incoming pod: if the spec omits
  #   runAsUser/fsGroup, the SCC fills them in from the namespace's allocated UID range. That is
  #   why TT-17018 added `enabled: false` to every securityContext block — a chart that pins a UID
  #   is rejected outright, so the user needs a way to omit the block entirely and let the cluster
  #   complete it. This job installs with exactly that configuration.
  #
  # WHAT THIS ACTUALLY PROVES (the half we can test)
  #   kind has no SCC admission controller. Nothing here injects a UID. So all this demonstrates
  #   is: the charts render with the blocks omitted, and every pod still reaches Ready without a
  #   securityContext. That is the "we correctly leave the hole" half of the contract.
  #
  #   Worth having on its own: the setupDirectories init container falls back to
  #   gateway.containerSecurityContext when its own block is disabled, and a bad fallback
  #   (runAsNonRoot with no runAsUser, against a root image like busybox) fails kubelet admission
  #   with CreateContainerConfigError. This job goes red on that.
  #
  # WHAT THIS DOES NOT PROVE (the half we cannot test here)
  #   That the cluster then *fills* the hole correctly — UID from the namespace range, fsGroup
  #   assigned, pods actually admitted under the SCC. Nothing in this job exercises that, because
  #   no such controller exists on kind. Until we have real SCC coverage, that half is validated
  #   only by hand (this PR was checked against a local CRC OpenShift cluster).
  #
  # WHY NOT JUST ENFORCE POD SECURITY ADMISSION INSTEAD
  #   Labelling the namespace pod-security.kubernetes.io/enforce=restricted looks like the obvious
  #   upgrade and is a trap. PSA only *validates*; it never mutates. Handed a pod with no
  #   securityContext it rejects it rather than completing it — the opposite of what SCC does. It
  #   would fail this job for the wrong reason and prove nothing about OpenShift.
  #
  #   Closing the gap for real needs a cluster that ships an SCC. MicroShift is the realistic
  #   candidate (lightweight enough for a GitHub runner, unlike CRC). Tracked separately.
  #
  # NAMING
  #   Deliberately not called an "openshift" test. If someone six months from now greps for
  #   OpenShift coverage, they should not find this job and conclude SCC is handled.
  # ---------------------------------------------------------------------------------------------
  smoke-tests-no-securitycontext:
    needs: [dep-guard]
    if: always() && (needs.dep-guard.result == 'success' || needs.dep-guard.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Plain kind — this is the ceiling on how OpenShift-like this job can be. A vanilla k8s
      # cluster has no SecurityContextConstraints controller, so the UID/GID injection that
      # OpenShift performs simply does not happen here. Swapping this for MicroShift is the one
      # change that would turn this into a genuine OpenShift test.
      #
      # Pinned to a single k8s version rather than the 5-way matrix the sibling smoke-tests job
      # uses: this exercises a values path, not a version-compatibility surface.
      - name: Create Kind Cluster
        uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced  # v1.9.0
        with:
          # TODO: Pin kindest/node image to digest
          node_image: "kindest/node:v1.30.0"

      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      # The OpenShift-shaped install: every securityContext block omitted, cluster left to fill in
      # the blanks. On OpenShift the SCC would; on kind nothing does, and the pods run with
      # whatever UID their images declare. --wait is what makes this meaningful — every pod has to
      # reach Ready, so a broken init-container fallback surfaces as a red job rather than a
      # rendered-but-unschedulable manifest.
      - name: Deploy Tyk OSS without securityContext
        run: |
          kubectl create namespace ${{ env.TYK_OSS_NS }}

          # Do not change the name
          # TODO: Pin OCI helm chart to digest
          helm install redis oci://registry-1.docker.io/bitnamicharts/redis --wait -n ${{ env.TYK_OSS_NS }} --timeout ${{ env.TIMEOUT }} \
            --set image.repository=bitnamilegacy/redis \
            --set sentinel.image.repository=bitnamilegacy/redis-sentinel \
            --set metrics.image.repository=bitnamilegacy/redis-exporter \
            --set volumePermissions.image.repository=bitnamilegacy/os-shell \
            --set kubectl.image.repository=bitnamilegacy/kubectl \
            --set sysctl.image.repository=bitnamilegacy/os-shell

          helm dependency update ./tyk-oss
          # The values file sets `enabled: false` on every securityContext block. Note it has to be
          # `enabled: false` and not `{}` — Helm deep-merges the component chart defaults back in,
          # so an empty map still renders a pinned runAsUser/fsGroup and OpenShift would reject it.
          helm install tyk-oss ./tyk-oss -n ${{ env.TYK_OSS_NS }} --wait --timeout ${{ env.TIMEOUT }} \
            -f ./tyk-oss/ci/no-securitycontext-values.yaml \
            --set global.redis.addrs={redis-master.${{ env.TYK_OSS_NS }}.svc:6379} \
            --set global.redis.passSecret.name=redis \
            --set global.redis.passSecret.keyName=redis-password

      # --wait passing only tells us the pods came up; on kind they would come up whether or not
      # the blocks were omitted, because nothing here rejects a pinned UID. So the install alone
      # cannot detect the values file drifting back to rendering a securityContext — which would
      # silently retire the OpenShift path while leaving this job green. Hence an explicit check
      # for the two fields OpenShift actually rejects (runAsUser and fsGroup must come from the
      # namespace's allocated range).
      # The selector matters. Tyk pods carry `release: <release>` and `app: <component>-<fullname>`;
      # they do NOT carry app.kubernetes.io/* labels, so selecting on those matches nothing here and
      # the assertion would pass vacuously. It would also sweep in the Bitnami Redis pods, which set
      # fsGroup: 1001 legitimately and are not what this job is asserting about.
      #
      # Read the WHOLE pod spec, not just `.spec.securityContext`. The two fields OpenShift rejects
      # live at different levels: fsGroup is pod-level, but runAsUser 65532 is on the
      # setupDirectories INIT CONTAINER. A pod-level-only check misses the init container entirely,
      # so dropping the init container's opt-out would leave this job green while breaking
      # OpenShift — verified by removing that one opt-out and watching the check still pass.
      # Container-level blocks are covered by the same widening.
      # runAsUser/fsGroup appear nowhere in a pod spec except securityContext blocks, so matching
      # against the full spec does not introduce false positives.
      - name: Assert no securityContext was rendered
        run: |
          set -euo pipefail
          found=$(kubectl get pods -n ${{ env.TYK_OSS_NS }} \
            -l release=tyk-oss \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec}{"\n"}{end}')
          echo "$found"

          # Anti-vacuity: an empty selection must fail loudly rather than pass silently. If the
          # chart's labels ever change, this job has to go red instead of quietly asserting nothing.
          count=$(kubectl get pods -n ${{ env.TYK_OSS_NS }} -l release=tyk-oss -o name | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::selector matched no Tyk pods - the assertion below would be vacuous"
            exit 1
          fi
          echo "checked $count Tyk pod(s)"

          if echo "$found" | grep -qE '(runAsUser|fsGroup)'; then
            echo "::error::securityContext was rendered despite enabled: false"
            exit 1
          fi

      - if: failure()
        name: Diagnostics on failure
        run: |
          NS=${{ env.TYK_OSS_NS }}
          kubectl get pods -n "$NS" -o wide || true
          kubectl get events -n "$NS" --sort-by='.lastTimestamp' | tail -50 || true
          kubectl get pods -n "$NS" -o name | while read p; do kubectl describe -n "$NS" "$p" || true; done
          # Same label caveat as the assertion above: `release` is the selector that matches Tyk pods.
          kubectl logs -n "$NS" -l release=tyk-oss --all-containers --tail=200 --prefix || true

      - name: Uninstall Tyk OSS
        run: |
          helm uninstall tyk-oss -n ${{ env.TYK_OSS_NS }} --timeout ${{ env.TIMEOUT }}
          kubectl delete namespace ${{ env.TYK_OSS_NS }}

  integration-tests:
    needs: [dep-guard]
    if: always() && (needs.dep-guard.result == 'success' || needs.dep-guard.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Create kind cluster
        uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced  # v1.9.0
        with:
          # TODO: Pin kindest/node image to digest
          node_image: "kindest/node:v1.34.0"

      - name: Deploy OSS and Dependencies
        id: deploy-oss
        run: |
          kubectl create namespace ${{ env.TYK_OSS_NS }}

          # Do not change the name
          # TODO: Pin OCI helm chart to digest
          helm install redis oci://registry-1.docker.io/bitnamicharts/redis --wait -n ${{ env.TYK_OSS_NS }} --timeout ${{ env.TIMEOUT }} --version 19.0.2 \
            --set image.repository=bitnamilegacy/redis \
            --set sentinel.image.repository=bitnamilegacy/redis-sentinel \
            --set metrics.image.repository=bitnamilegacy/redis-exporter \
            --set volumePermissions.image.repository=bitnamilegacy/os-shell \
            --set kubectl.image.repository=bitnamilegacy/kubectl \
            --set sysctl.image.repository=bitnamilegacy/os-shell

          helm dependency update ./tyk-oss

          helm install --namespace ${{ env.TYK_OSS_NS }} tyk-oss ./tyk-oss --wait \
          --set "global.redis.addrs={redis-master.${{ env.TYK_OSS_NS }}.svc:6379}" \
          --set "global.redis.passSecret.name=redis" \
          --set "global.redis.passSecret.keyName=redis-password" \
          --timeout=${{ env.TIMEOUT }}

      - name: Run integration tests for Tyk OSS
        id: test-oss
        run: helm test -n ${{ env.TYK_OSS_NS }} tyk-oss

      - if: failure()
        name: Check logs in case of failure
        run: |
          if [ ${{ steps.deploy-oss.conclusion }} == 'failure' ]; then
            kubectl logs -n ${{ env.TYK_OSS_NS }} gateway-tyk-oss-tyk-gateway
          elif [ ${{ steps.test-oss.conclusion }} == 'failure' ]; then
            kubectl logs -n ${{ env.TYK_OSS_NS }} tyk-oss-test-tyk-oss
          fi

      - name: Uninstall Tyk OSS Dependencies
        run: |
          helm uninstall redis -n ${{ env.TYK_OSS_NS }} --timeout ${{ env.TIMEOUT }}
          kubectl delete namespace ${{ env.TYK_OSS_NS }}

      - name: Deploy Tyk Stack and dependencies
        id: deploy-stack
        run: |
          kubectl create namespace ${{ env.TYK_STACK_NS }}

          # Do not change the name
          # Install redis
          # TODO: Pin OCI helm chart to digest
          helm install redis oci://registry-1.docker.io/bitnamicharts/redis --wait -n ${{ env.TYK_STACK_NS }} --timeout ${{ env.TIMEOUT }} --version 19.0.2 \
            --set image.repository=bitnamilegacy/redis \
            --set sentinel.image.repository=bitnamilegacy/redis-sentinel \
            --set metrics.image.repository=bitnamilegacy/redis-exporter \
            --set volumePermissions.image.repository=bitnamilegacy/os-shell \
            --set kubectl.image.repository=bitnamilegacy/kubectl \
            --set sysctl.image.repository=bitnamilegacy/os-shell

          # Install mongo
          # TODO: Pin OCI helm chart to digest
          helm install mongo oci://registry-1.docker.io/bitnamicharts/mongodb --wait -n ${{ env.TYK_STACK_NS }} --timeout ${{ env.TIMEOUT }} --version 15.1.3 \
            --set image.repository=bitnamilegacy/mongodb \
            --set externalAccess.autoDiscovery.image.repository=bitnamilegacy/nginx \
            --set volumePermissions.image.repository=bitnamilegacy/os-shell \
            --set kubectl.image.repository=bitnamilegacy/kubectl

          MONGODB_ROOT_PASSWORD=$(kubectl get secret -n ${{ env.TYK_STACK_NS }} mongo-mongodb -o jsonpath="{.data.mongodb-root-password}" | base64 -d)

          helm dependency update ./tyk-stack

          helm install --namespace ${{ env.TYK_STACK_NS }} tyk-stack ./tyk-stack --wait \
            --set "global.mongo.mongoURL=mongodb://root:$MONGODB_ROOT_PASSWORD@mongo-mongodb.${{ env.TYK_STACK_NS }}.svc:27017/tyk_analytics?authSource=admin" \
            --set "global.redis.addrs={redis-master.${{ env.TYK_STACK_NS }}.svc:6379"} \
            --set "global.redis.passSecret.name=redis" \
            --set "global.redis.passSecret.keyName=redis-password" \
            --set "global.license.dashboard=${{ secrets.DASH_LICENSE }}" \
            --set "global.storageType=mongo" \
            --timeout=${{ env.TIMEOUT }}

      - name: Run integration tests for Tyk Stack
        id: test-stack
        run: helm test -n ${{ env.TYK_STACK_NS }} tyk-stack

      - if: failure()
        name: Check logs in case of failure
        run: |
          if [ ${{ steps.deploy-stack.conclusion }} == 'failure' ]; then
            kubectl logs -n ${{ env.TYK_STACK_NS }} deployment/dashboard-tyk-stack-tyk-dashboard
            kubectl logs -n ${{ env.TYK_STACK_NS }} job.batch/bootstrap-post-install-tyk-stack-tyk-bootstrap
          elif [ ${{ steps.test-stack.conclusion }} == 'failure' ]; then
            kubectl logs -n ${{ env.TYK_STACK_NS }} tyk-stack-test-tyk-stack
          fi

      - name: Uninstall Tyk Stack Dependencies
        run: |
          helm uninstall redis -n ${{ env.TYK_STACK_NS }} --timeout ${{ env.TIMEOUT }}
          helm uninstall mongo -n ${{ env.TYK_STACK_NS }} --timeout ${{ env.TIMEOUT }}
          helm uninstall tyk-stack -n ${{ env.TYK_STACK_NS }} --timeout ${{ env.TIMEOUT }}
          kubectl delete namespace ${{ env.TYK_STACK_NS }}

      - name: Deploy Tyk Data Plane and Dependencies
        id: deploy-data-plane
        run: |
          kubectl create namespace ${{ env. TYK_DATAPLANE_NS }}

          # Do not change the name
          # TODO: Pin OCI helm chart to digest
          helm install redis oci://registry-1.docker.io/bitnamicharts/redis --wait -n ${{ env.TYK_DATAPLANE_NS }} --timeout ${{ env.TIMEOUT }} --version 19.0.2 \
            --set image.repository=bitnamilegacy/redis \
            --set sentinel.image.repository=bitnamilegacy/redis-sentinel \
            --set metrics.image.repository=bitnamilegacy/redis-exporter \
            --set volumePermissions.image.repository=bitnamilegacy/os-shell \
            --set kubectl.image.repository=bitnamilegacy/kubectl \
            --set sysctl.image.repository=bitnamilegacy/os-shell

          helm dependency update ./tyk-data-plane

          helm install --namespace ${{ env. TYK_DATAPLANE_NS }} tyk-data-plane ./tyk-data-plane --wait --timeout ${{ env.TIMEOUT }} \
            --set "global.redis.addrs={redis-master.${{ env. TYK_DATAPLANE_NS }}.svc:6379"} \
            --set "global.redis.passSecret.name=redis" \
            --set "global.redis.passSecret.keyName=redis-password" \
            --set global.remoteControlPlane.orgId=${{ secrets.HYBRID_RPC_KEY }} \
            --set global.remoteControlPlane.userApiKey=${{ secrets.HYBRID_API_KEY }} \
            --set global.remoteControlPlane.connectionString=${{ secrets.HYBRID_MDCB_HOST }}

      - name: Run integration tests for Tyk Data Plane
        id: test-data-plane
        run: helm test -n ${{ env. TYK_DATAPLANE_NS }} tyk-data-plane

      - if: failure()
        name: Check logs in case of failure
        run: |
          if [ ${{ steps.deploy-data-plane.conclusion }} == 'failure' ]; then
            kubectl logs -n ${{ env. TYK_DATAPLANE_NS }} deployment/gateway-tyk-data-plane-tyk-gateway
          elif [ ${{ steps.test-data-plane.conclusion }} == 'failure' ]; then
            kubectl logs -n ${{ env. TYK_DATAPLANE_NS }} tyk-data-plane-test-tyk-data-plane
          fi

      - name: Uninstall Tyk Data Plane Dependencies
        run: |
          helm uninstall tyk-data-plane -n ${{ env. TYK_DATAPLANE_NS }}
          helm uninstall redis -n ${{ env. TYK_DATAPLANE_NS }} --timeout ${{ env.TIMEOUT }}
          kubectl delete namespace ${{ env. TYK_DATAPLANE_NS }}
