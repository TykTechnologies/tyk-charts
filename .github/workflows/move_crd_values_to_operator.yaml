name: Apply Operator Helm Chart Changes To Operator Repo

on:
  push:
    branches:
      - main
    paths:
      - 'components/tyk-operator/**'

permissions: {}

jobs:
  check-specific-file:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      CHANGED: ${{ steps.check_changes.outputs.CHANGED }}
      CHART_VERSION: ${{ steps.chart_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      - name: Read chart version
        id: chart_version
        run: echo "version=$(awk '/^version:/ {print $2}' components/tyk-operator/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Check for Changes in components/tyk-operator/templates/all.yaml
        id: check_changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "$BEFORE" "$AFTER")"
          else
            changed_files="$(git show --name-only --pretty=format: "$AFTER")"
          fi

          echo "Changed files:"
          echo "$changed_files"

          if echo "$changed_files" | grep -q "components/tyk-operator/templates/all.yaml"; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy manifest and chart files into a temporary directory
        if: steps.check_changes.outputs.CHANGED == 'true'
        run: |
          mkdir -p /tmp/helm/templates
          mkdir -p /tmp/charts
          cp "${GITHUB_WORKSPACE}/components/tyk-operator/templates/all.yaml" /tmp/helm/templates/all.yaml
          cp "${GITHUB_WORKSPACE}/components/tyk-operator/Chart.yaml" /tmp/charts/
          cp "${GITHUB_WORKSPACE}/components/tyk-operator/values.yaml" /tmp/charts/

      - name: Upload templates
        if: steps.check_changes.outputs.CHANGED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: helm
          path: /tmp/helm

      - name: Upload Chart.yaml and values.yaml
        if: steps.check_changes.outputs.CHANGED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: charts
          path: /tmp/charts

  process-changes:
    needs: check-specific-file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: needs.check-specific-file.outputs.CHANGED == 'true'

    steps:
      - name: Checkout other repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: TykTechnologies/tyk-operator-internal
          token: ${{ secrets.PAT }}

      - name: Create and checkout new branch
        run: |
          SHORT_UID=$(uuidgen | cut -c1-8)
          BRANCH_NAME="file-changed-${{ needs.check-specific-file.outputs.CHART_VERSION }}-${SHORT_UID}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_UID=${SHORT_UID}" >> "$GITHUB_ENV"
          git checkout -b "${BRANCH_NAME}"

      - name: Download templates into helm directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: helm
          path: helm/

      - name: Download Chart.yaml and values.yaml into helm directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: charts
          path: helm/

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/
          git commit -m "add new change to file version ${{ needs.check-specific-file.outputs.CHART_VERSION }}-${{ env.SHORT_UID }}"
          git push origin "${{ env.BRANCH_NAME }}"

      - name: Create a pull request
        run: |
          gh pr create --base master --head "${{ env.BRANCH_NAME }}" \
            --title "Update Tyk Operator Templates for version ${{ needs.check-specific-file.outputs.CHART_VERSION }}" \
            --body "Changes include template updates from tyk-charts for chart version ${{ needs.check-specific-file.outputs.CHART_VERSION }}."
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
