name: Unit Tests for Charts

on:
  pull_request: {}
  push:
    branches:
      - master

permissions: {}

jobs:
  dep-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for dependency changes
        id: check
        run: echo "skip=false" >> "$GITHUB_OUTPUT"

  unit-test:
    needs: [dep-guard]
    if: always() && (needs.dep-guard.result == 'success' || needs.dep-guard.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3
        with:
          fetch-depth: 0

      - name: Update dependencies
        # The umbrella charts pull the component charts in over file:// dependencies. Their suites
        # cannot render until those are vendored into charts/, so update every chart that declares
        # dependencies rather than tyk-stack alone.
        run: |
          set -euo pipefail
          for chart in $(find . -name Chart.yaml -not -path '*/charts/*' -exec dirname {} \; | sort -u); do
            if grep -q '^dependencies:' "$chart/Chart.yaml"; then
              echo "==> helm dependency update $chart"
              helm dependency update "$chart"
            fi
          done

      - name: Set up unit tests
        # TODO: Pin helm plugin to a release tag instead of default branch
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.7.2

      - name: Run unit tests
        # Discovered rather than hardcoded so newly added suites are picked up without editing this
        # workflow. A chart qualifies only if it has root-level tests/*_test.yaml specs; charts whose
        # only tests/ directory sits under templates/ (those hold `helm test` hook pods, e.g.
        # tyk-data-plane and tyk-oss) are skipped, since helm unittest reports "0 passed, 0 total"
        # for them and that is not a meaningful result.
        run: |
          set -euo pipefail
          charts=()
          for chart in $(find . -name Chart.yaml -not -path '*/charts/*' -exec dirname {} \; | sort -u); do
            if ls "$chart"/tests/*_test.yaml > /dev/null 2>&1; then
              charts+=("$chart")
            fi
          done
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No chart contains tests/*_test.yaml suites" >&2
            exit 1
          fi
          echo "==> helm unittest ${charts[*]}"
          helm unittest "${charts[@]}"
