# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test imagePullSecrets for bootstrap jobs
templates:
  - charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
  - charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
  - charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
  - charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
  - charts/tyk-dev-portal/templates/job-portal.yaml
release:
  name: tyk-stack
  namespace: test
tests:
  # ServiceAccount imagePullSecrets tests
  - it: should not set imagePullSecrets on ServiceAccount when not specified
    values:
      - ../values.yaml
    template: charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
    asserts:
      - notExists:
          path: imagePullSecrets

  - it: should set imagePullSecrets on ServiceAccount when specified
    values:
      - ../values.yaml
    set:
      tyk-bootstrap.bootstrap.imagePullSecrets[0].name: my-pull-secret
    template: charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
    asserts:
      - equal:
          path: imagePullSecrets[0].name
          value: my-pull-secret

  # Bootstrap job pod specs must never carry imagePullSecrets (delegated to ServiceAccount)
  - it: should not set imagePullSecrets on pre-install job pod spec
    values:
      - ../values.yaml
    template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should not set imagePullSecrets on pre-install job pod spec even when specified
    values:
      - ../values.yaml
    set:
      tyk-bootstrap.bootstrap.imagePullSecrets[0].name: my-pull-secret
    template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should not set imagePullSecrets on post-install job pod spec
    values:
      - ../values.yaml
    template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should not set imagePullSecrets on post-install job pod spec even when specified
    values:
      - ../values.yaml
    set:
      tyk-bootstrap.bootstrap.imagePullSecrets[0].name: my-pull-secret
    template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should not set imagePullSecrets on pre-delete job pod spec
    values:
      - ../values.yaml
    template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should not set imagePullSecrets on pre-delete job pod spec even when specified
    values:
      - ../values.yaml
    set:
      tyk-bootstrap.bootstrap.imagePullSecrets[0].name: my-pull-secret
    template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  # Dev Portal bootstrap job imagePullSecrets tests (uses pod spec directly, no ServiceAccount)
  - it: should not set dev portal bootstrap job imagePullSecrets when not specified
    values:
      - ../values.yaml
    set:
      global.components.devPortal: true
    template: charts/tyk-dev-portal/templates/job-portal.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should set dev portal bootstrap job imagePullSecrets when specified
    values:
      - ../values.yaml
    set:
      global.components.devPortal: true
      tyk-dev-portal.imagePullSecrets[0].name: my-pull-secret
    template: charts/tyk-dev-portal/templates/job-portal.yaml
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: my-pull-secret

  # Dev Portal bootstrap job imageRegistry test
  - it: should use global imageRegistry prefix for dev portal bootstrap job image
    values:
      - ../values.yaml
    set:
      global.components.devPortal: true
      global.imageRegistry: myregistry.io/
    template: charts/tyk-dev-portal/templates/job-portal.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myregistry.io/curlimages/curl:8.8.0
