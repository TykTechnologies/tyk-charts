# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Umbrella-level lock for the second round of TT-17018 bootstrap fixes. The
# authoritative component suites live in components/tyk-bootstrap/tests/
# (bootstrapRbacMetadata, bootstrapAnnotationQuoting, bootstrapSecurityContextEnabled);
# this file verifies they survive subchart value plumbing, and it is the suite CI
# actually runs (.github/workflows/unit-tests.yaml runs `helm unittest ./tyk-stack`).
#
# Covered:
#   * RBAC trio: `annotations:` key omitted (not null) under disableHelmHooks
#   * user-supplied annotation values quoted, so an ArgoCD sync-wave integer
#     renders as the string "-1" and not a YAML int (metadata.annotations is
#     map[string]string and the API server rejects a non-string value)
#   * pre-delete Job pod template carries real labels and no null annotations
#   * user-supplied pod LABEL values quoted too: metadata.labels is map[string]string
#     under the same constraint, so an integer label value is rejected identically
#   * securityContext `enabled: false` omits the block; the sentinel never leaks
suite: Bootstrap annotations, RBAC metadata and securityContext escape hatch
templates:
  - charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
  - charts/tyk-bootstrap/templates/bootstrap-role.yml
  - charts/tyk-bootstrap/templates/bootstrap-role-binding.yml
  - charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
  - charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
  - charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
release:
  name: tyk-stack
  namespace: test
tests:
  # ---------- RBAC: annotations key must be omitted, never null ----------
  - it: serviceaccount, disableHelmHooks=true + no rbacAnnotations -> annotations key absent
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
    template: charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations

  - it: role, disableHelmHooks=true + no rbacAnnotations -> annotations key absent
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
    template: charts/tyk-bootstrap/templates/bootstrap-role.yml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations

  - it: rolebinding, disableHelmHooks=true + no rbacAnnotations -> annotations key absent
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
    template: charts/tyk-bootstrap/templates/bootstrap-role-binding.yml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations

  - it: RBAC trio, disableHelmHooks=true + rbacAnnotations set -> annotations present
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
      tyk-bootstrap.bootstrap.rbacAnnotations.sampleAnnotation: enabled
    asserts:
      - equal:
          path: metadata.annotations.sampleAnnotation
          value: enabled
        template: charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
      - equal:
          path: metadata.annotations.sampleAnnotation
          value: enabled
        template: charts/tyk-bootstrap/templates/bootstrap-role.yml
      - equal:
          path: metadata.annotations.sampleAnnotation
          value: enabled
        template: charts/tyk-bootstrap/templates/bootstrap-role-binding.yml

  - it: RBAC trio, defaults -> helm hook annotations unchanged
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
        template: charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
        template: charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
        template: charts/tyk-bootstrap/templates/bootstrap-role.yml
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
        template: charts/tyk-bootstrap/templates/bootstrap-role-binding.yml

  # ---------- annotation values must be quoted into strings ----------
  - it: RBAC trio, integer sync-wave annotation -> rendered as the string "-1"
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
      tyk-bootstrap.bootstrap.rbacAnnotations:
        argocd.argoproj.io/sync-wave: -1
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: charts/tyk-bootstrap/templates/bootstrap-serviceaccount.yml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: charts/tyk-bootstrap/templates/bootstrap-role.yml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: charts/tyk-bootstrap/templates/bootstrap-role-binding.yml

  - it: pre-install Job, integer sync-wave on job and pod annotations -> both quoted
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
      tyk-bootstrap.bootstrap.jobs.preInstall.annotations:
        argocd.argoproj.io/sync-wave: -1
      tyk-bootstrap.bootstrap.podAnnotations.preInstallPodAnnotations:
        argocd.argoproj.io/sync-wave: -1
    template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

  - it: post-install Job, integer sync-wave on job and pod annotations -> both quoted
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
      tyk-bootstrap.bootstrap.jobs.postInstall.annotations:
        argocd.argoproj.io/sync-wave: -1
      tyk-bootstrap.bootstrap.podAnnotations.postInstallPodAnnotations:
        argocd.argoproj.io/sync-wave: -1
    template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

  - it: pre-delete Job, integer sync-wave on job and pod annotations -> both quoted
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.jobs.preDelete.annotations:
        argocd.argoproj.io/sync-wave: -1
      tyk-bootstrap.bootstrap.podAnnotations.preDeletePodAnnotations:
        argocd.argoproj.io/sync-wave: -1
    template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      # hardcoded hook annotations untouched
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete

  # ---------- pre-delete pod template must not render null metadata ----------
  - it: pre-delete Job, defaults -> no null pod annotations, real pod labels
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
    template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.template.metadata.annotations
      - exists:
          path: spec.template.metadata.labels
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-pre-delete
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: tyk-stack

  # ---------- securityContext escape hatch ----------
  - it: all three Jobs, defaults -> securityContext rendered without the enabled sentinel
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.enabled
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
      - notExists:
          path: spec.template.spec.containers[0].securityContext.enabled
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
      - notExists:
          path: spec.template.spec.securityContext.enabled
        template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
      - notExists:
          path: spec.template.spec.containers[0].securityContext.enabled
        template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
      - notExists:
          path: spec.template.spec.securityContext.enabled
        template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
      - notExists:
          path: spec.template.spec.containers[0].securityContext.enabled
        template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml

  - it: all three Jobs, enabled=false on both blocks -> every securityContext omitted
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.securityContext.enabled: false
      tyk-bootstrap.bootstrap.containerSecurityContext.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
      - notExists:
          path: spec.template.spec.containers[0].securityContext
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
      - notExists:
          path: spec.template.spec.securityContext
        template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
      - notExists:
          path: spec.template.spec.containers[0].securityContext
        template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
      - notExists:
          path: spec.template.spec.securityContext
        template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
      - notExists:
          path: spec.template.spec.containers[0].securityContext
        template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml

  - it: pre-install Job, pod-level enabled=false leaves the container block intact
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.securityContext.enabled: false
    template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  # ---------- pod LABEL values must be quoted into strings ----------
  # An integer label value is rejected by the API server exactly like an integer
  # annotation value. The pre-existing coverage only used string label values,
  # which is why this survived the annotation-quoting pass.
  - it: pre-install Job, integer pod label -> rendered as the string "12345"
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.podLabels.preInstallPodLabels:
        revision: 12345
    template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.revision
          value: "12345"
      # the three hardcoded pod labels must render exactly as before
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: tyk-stack
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-pre-install

  - it: post-install Job, integer pod label -> rendered as the string "12345"
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.podLabels.postInstallPodLabels:
        revision: 12345
    template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.revision
          value: "12345"
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: tyk-stack
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-post-install

  - it: pre-delete Job, integer pod label -> rendered as the string "12345"
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.podLabels.preDeletePodLabels:
        revision: 12345
    template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.revision
          value: "12345"
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: tyk-stack
      - equal:
          path: spec.template.metadata.labels["tyk.tyk.io/k8s-bootstrap"]
          value: tyk-k8s-bootstrap-pre-delete

  - it: pre-install Job, boolean-looking pod label -> rendered as the string "true"
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.podLabels.preInstallPodLabels:
        canary: true
    template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.canary
          value: "true"

  # ---------- pod labels are never null when the user map is empty ----------
  - it: pre/post-install Jobs, empty pod label map under disableHelmHooks -> real 3-entry maps
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.labels
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/instance: tyk-stack
            tyk.tyk.io/k8s-bootstrap: tyk-k8s-bootstrap-pre-install
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
      - notExists:
          path: spec.template.metadata.annotations
        template: charts/tyk-bootstrap/templates/bootstrap-pre-install.yaml
      - isNotNullOrEmpty:
          path: spec.template.metadata.labels
        template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/instance: tyk-stack
            tyk.tyk.io/k8s-bootstrap: tyk-k8s-bootstrap-post-install
        template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml
      - notExists:
          path: spec.template.metadata.annotations
        template: charts/tyk-bootstrap/templates/bootstrap-post-install.yaml

  # ---------- disableHelmHooks suppresses the pre-delete Job outright ----------
  # Locks what values.yaml documents: the template is gated in full, so no
  # preDelete annotation can bring the Job back for a GitOps deletion hook.
  - it: pre-delete Job, disableHelmHooks -> not rendered even with annotations set
    values:
      - ../values.yaml
    set:
      global.components.bootstrap: true
      tyk-bootstrap.bootstrap.disableHelmHooks: true
      tyk-bootstrap.bootstrap.jobs.preDelete.annotations:
        argocd.argoproj.io/hook: PreDelete
      tyk-bootstrap.bootstrap.podLabels.preDeletePodLabels:
        revision: 12345
    template: charts/tyk-bootstrap/templates/bootstrap-pre-delete.yaml
    asserts:
      - hasDocuments:
          count: 0
