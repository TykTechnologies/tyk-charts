# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test Pump HPA
templates:
  - charts/tyk-pump/templates/hpa.yaml
  - charts/tyk-pump/templates/deployment-pmp.yaml
  - charts/tyk-pump/templates/secrets.yaml
release:
  name: tyk-stack
  namespace: test
tests:
  - it: renders no HPA when autoscaling is unset (default)
    values:
      - ../values.yaml
    template: charts/tyk-pump/templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no HPA when autoscaling is explicitly disabled
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: false
    template: charts/tyk-pump/templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an HPA with default min/max/cpu when enabled
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: true
    template: charts/tyk-pump/templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 3
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0]
          value:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 60
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: pump-tyk-stack-tyk-pump

  - it: respects custom minReplicas, maxReplicas and averageCpuUtilization
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: true
      tyk-pump.pump.autoscaling.minReplicas: 3
      tyk-pump.pump.autoscaling.maxReplicas: 30
      tyk-pump.pump.autoscaling.averageCpuUtilization: 75
    template: charts/tyk-pump/templates/hpa.yaml
    asserts:
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 30
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 75

  - it: adds a memory metric when averageMemoryUtilization is set
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: true
      tyk-pump.pump.autoscaling.averageMemoryUtilization: 70
    template: charts/tyk-pump/templates/hpa.yaml
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[1]
          value:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 70

  - it: appends a custom metric from autoscalingTemplate
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: true
      tyk-pump.pump.autoscaling.autoscalingTemplate:
        - type: Pods
          pods:
            metric:
              name: nginx_ingress_controller_nginx_process_requests_total
            target:
              type: AverageValue
              averageValue: 10000m
    template: charts/tyk-pump/templates/hpa.yaml
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[1]
          value:
            type: Pods
            pods:
              metric:
                name: nginx_ingress_controller_nginx_process_requests_total
              target:
                type: AverageValue
                averageValue: 10000m

  - it: sets a custom scaleDown/scaleUp behavior block
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: true
      tyk-pump.pump.autoscaling.behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleUp:
          stabilizationWindowSeconds: 0
    template: charts/tyk-pump/templates/hpa.yaml
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
      - equal:
          path: spec.behavior.scaleUp.stabilizationWindowSeconds
          value: 0
      - equal:
          path: spec.behavior.scaleDown.policies[0]
          value:
            type: Percent
            value: 100
            periodSeconds: 15

  - it: HPA scaleTargetRef name matches the rendered Pump Deployment name
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: true
    template: charts/tyk-pump/templates/deployment-pmp.yaml
    asserts:
      - equal:
          path: metadata.name
          value: pump-tyk-stack-tyk-pump

  # Deployment must NOT hardcode replicas when autoscaling is enabled, otherwise every
  # helm upgrade / GitOps reconcile fights the HPA. Matches the Gateway/MDCB pattern.
  - it: Deployment sets replicas when autoscaling is disabled (default)
    values:
      - ../values.yaml
    template: charts/tyk-pump/templates/deployment-pmp.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: Deployment omits replicas when autoscaling is enabled (HPA owns replica count)
    values:
      - ../values.yaml
    set:
      tyk-pump.pump.autoscaling.enabled: true
    template: charts/tyk-pump/templates/deployment-pmp.yaml
    asserts:
      - notExists:
          path: spec.replicas
