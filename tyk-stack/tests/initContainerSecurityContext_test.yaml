# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
#
# Locks the setup-directories runAsUser precedence fixed in TT-18257:
#   init-specific UID -> main-container UID -> pod UID -> 65532.
# The whole-block enabled=false fallback introduced in TT-17018 remains intact.
#
# Required so init-container UID stays aligned with the gateway image's USER
# (currently 65532). A regression here re-introduces the "file object creation
# failed, write error" we saw on PR #485.
suite: Gateway setup-directories init container securityContext precedence
templates:
  - charts/tyk-gateway/templates/deployment-gw-repset.yaml
  - charts/tyk-gateway/templates/secrets.yaml
release:
  name: tyk-stack
  namespace: test
tests:
  - it: defaults the init container UID to the gateway image UID
    values:
      - ../values.yaml
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 65532
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser

  - it: reuses a retained main-container UID for the init container on upgrade
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.containerSecurityContext.runAsUser: 1000
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000

  - it: uses the pod UID when the main container inherits it
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.securityContext.runAsUser: 4242
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 4242
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 4242
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser

  - it: applies the init-container-specific securityContext when set
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.initContainers.setupDirectories.securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: init-specific securityContext wins over containerSecurityContext when both are set
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.initContainers.setupDirectories.securityContext:
        runAsUser: 2000
      tyk-gateway.gateway.containerSecurityContext:
        runAsUser: 1000
        runAsNonRoot: true
      tyk-gateway.gateway.securityContext.runAsUser: 4242
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 2000
      # main containerSecurityContext still applies to the gateway container
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 4242

  # enabled=false escape hatches let clusters (OpenShift SCC, kyverno, etc.) inject
  # their own UIDs/GIDs. Setting securityContext: {} cannot work because Helm
  # deep-merges defaults back in; each block needs its own scoped disable flag.
  - it: init securityContext.enabled=false omits the init-specific block (falls through to containerSecurityContext)
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.initContainers.setupDirectories.securityContext.enabled: false
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      # init container falls through to containerSecurityContext, which has no runAsUser
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true

  - it: disabled main-container securityContext cannot contribute its UID
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.containerSecurityContext.enabled: false
      tyk-gateway.gateway.containerSecurityContext.runAsUser: 1000
      tyk-gateway.gateway.securityContext.runAsUser: 4242
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 4242
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: disabled pod securityContext cannot contribute its UID
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.securityContext.enabled: false
      tyk-gateway.gateway.securityContext.runAsUser: 4242
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 65532
      - notExists:
          path: spec.template.spec.securityContext

  - it: setting enabled=false on all three blocks strips every gateway securityContext
    values:
      - ../values.yaml
    set:
      tyk-gateway.gateway.securityContext.enabled: false
      tyk-gateway.gateway.containerSecurityContext.enabled: false
      tyk-gateway.gateway.initContainers.setupDirectories.securityContext.enabled: false
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext

  - it: enabled key is stripped from rendered manifest (not a valid k8s field)
    values:
      - ../values.yaml
    template: charts/tyk-gateway/templates/deployment-gw-repset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.enabled
      - notExists:
          path: spec.template.spec.containers[0].securityContext.enabled
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.enabled
